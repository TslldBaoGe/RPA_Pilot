name: Release

# 发版方式：打一个 v 开头的标签并推送，即自动构建并发布。
#   git tag v0.1.4
#   git push origin v0.1.4
# 也可以在 Actions 页面手动触发（需要填版本号）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（形如 0.1.4，不要带 v）'
        required: true
        type: string

# 创建 Release 需要写权限
permissions:
  contents: write

env:
  # ⚠️ 关键：本机开发时为了绕过 GitHub 直连慢，脚本默认走 npmmirror 国内镜像。
  #    GitHub runner 上那个镜像反而慢且不稳定，所以这里显式覆盖回官方源。
  #    scripts/fetch-electron.mjs 会优先采用外部传入的 ELECTRON_MIRROR。
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  # 让 electron-builder 也从官方源取 winCodeSign / nsis 工具
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 先装依赖再改版本号，避免动到 package.json 后影响 --frozen-lockfile 的一致性判断
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $raw = if ('${{ github.event_name }}' -eq 'push') {
            '${{ github.ref_name }}'
          } else {
            '${{ inputs.version }}'
          }
          $v = $raw.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "版本号格式不对：'$raw'（期望形如 0.1.4 或 v0.1.4）"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "本次发布版本：$v"

      - name: 写入版本号
        run: node scripts/set-version.mjs ${{ steps.ver.outputs.version }}

      # 把「本机地址被当成正式更新源发出去」这类错误挡在打包之前
      - name: 发版配置体检
        run: node scripts/check-release-config.mjs

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建安装包
        run: pnpm build:win:ci

      # 最关键的一步：证实更新源真的被写进了产物，而不是只改了配置文件
      - name: 校验产物里的更新源
        shell: pwsh
        run: |
          $yml = 'out-installer/win-unpacked/resources/app-update.yml'
          if (-not (Test-Path $yml)) { throw "打包产物里没有 app-update.yml：$yml" }
          Get-Content $yml
          $expected = (Select-String -Path electron-builder.yml -Pattern '^\s*url:\s*(.+?)\s*$').Matches[0].Groups[1].Value
          $actual = (Select-String -Path $yml -Pattern '^\s*url:\s*(.+?)\s*$').Matches[0].Groups[1].Value
          if ($actual -ne $expected) {
            throw "产物里的更新源与配置不一致！配置=$expected 产物=$actual"
          }
          Write-Host "✓ 产物更新源正确：$actual"

      - name: 检查产物齐全
        shell: pwsh
        run: |
          $need = @('latest.yml')
          foreach ($n in $need) {
            if (-not (Test-Path "out-installer/$n")) { throw "缺少产物 out-installer/$n" }
          }
          $exe = Get-ChildItem out-installer/*.exe -ErrorAction SilentlyContinue
          $map = Get-ChildItem out-installer/*.blockmap -ErrorAction SilentlyContinue
          if (-not $exe) { throw '没有生成安装包（*.exe）' }
          if (-not $map) { throw '没有生成差量索引（*.blockmap）' }
          Get-ChildItem out-installer -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          # 只挂这三个文件：latest.yml 是 electron-updater 的入口，
          # exe 是安装包本体，blockmap 用于差量下载
          files: |
            out-installer/latest.yml
            out-installer/*.exe
            out-installer/*.blockmap
